name: Publish to PyPI / TestPyPI

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: "Publish target"
        required: true
        default: "testpypi"
        type: choice
        options:
          - testpypi

jobs:
  lint:
    name: Lint and formatting
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install ruff
      - name: Lint
        run: ruff check plotnine_extra tests
      - name: Check formatting
        run: ruff format --check plotnine_extra tests

  test:
    name: Test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e ".[test]"
      - name: Run tests with coverage
        run: |
          python -m pytest tests/ -v \
            --cov=plotnine_extra \
            --cov-report=term-missing \
            --cov-fail-under=50

  notebooks:
    name: Execute vignette notebooks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc
      - name: Install dependencies
        run: pip install -e ".[doc]"
      - name: Execute all vignette notebooks
        run: |
          jupyter nbconvert --to notebook --execute --inplace \
            --ExecutePreprocessor.timeout=600 \
            docs/vignettes/*.ipynb

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: pip install build twine
      - name: Read package version
        id: version
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          with open("pyproject.toml", "rb") as fh:
              version = tomllib.load(fh)["project"]["version"]
          print(f"version={version}")
          PY
      - name: Guard release tag
        if: github.event_name == 'release'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          expected="refs/tags/v${VERSION}"
          if [ "${GITHUB_REF}" != "${expected}" ]; then
            echo "Release tag ${GITHUB_REF} does not match ${expected}" >&2
            exit 1
          fi
      - name: Build sdist and wheel
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check dist/*
      - name: Install wheel and smoke-test exports
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python -m venv /tmp/plotnine-extra-publish-smoke
          /tmp/plotnine-extra-publish-smoke/bin/python -m pip install --upgrade pip
          /tmp/plotnine-extra-publish-smoke/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/plotnine-extra-publish-smoke/bin/python - <<'PY'
          from plotnine_extra import *  # noqa: F403
          import os
          import plotnine_extra

          assert plotnine_extra.__version__ == os.environ["VERSION"]
          assert callable(ggplot)  # noqa: F405
          assert callable(geom_pointdensity)  # noqa: F405
          PY
      - name: Install sdist and smoke-test exports
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python -m venv /tmp/plotnine-extra-sdist-smoke
          /tmp/plotnine-extra-sdist-smoke/bin/python -m pip install --upgrade pip
          /tmp/plotnine-extra-sdist-smoke/bin/python -m pip install dist/*.tar.gz
          cd /tmp
          /tmp/plotnine-extra-sdist-smoke/bin/python - <<'PY'
          from plotnine_extra import *  # noqa: F403
          import os
          import plotnine_extra

          assert plotnine_extra.__version__ == os.environ["VERSION"]
          assert callable(ggplot)  # noqa: F405
          assert callable(geom_pointdensity)  # noqa: F405
          PY
      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    name: Publish to TestPyPI
    needs: [lint, test, notebooks, build]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/plotnine-extra
    permissions:
      id-token: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    needs: [lint, test, notebooks, build]
    if: github.event_name == 'release' && github.ref == format('refs/tags/v{0}', needs.build.outputs.version)
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/plotnine-extra
    permissions:
      id-token: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
